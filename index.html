<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard - Public View</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--bg-card:#111827;--bg-card-alt:#0f1523;--bg-header:#0d1220;
  --border:#1e293b;--border-light:#2a3a52;
  --text:#e2e8f0;--text-dim:#8892a8;--text-muted:#4a5568;
  --green:#00ff88;--red:#ff3355;--blue:#3b82f6;--yellow:#fbbf24;--orange:#f97316;
  --purple:#a78bfa;--cyan:#22d3ee;
}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue);text-decoration:none}

/* Header */
.header{text-align:center;padding:1.5rem 1rem .8rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.6rem;font-weight:700;letter-spacing:.04em;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{font-size:.75rem;color:var(--text-muted);letter-spacing:.15em;text-transform:uppercase;margin-top:.2rem}

/* Layout */
.container{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.row-top{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* Card */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:var(--bg-header);border-bottom:1px solid var(--border)}
.card-head h2{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}
.card-body{padding:1rem}

/* ---- WORLD CLOCK ---- */
.clock-grid{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.clock-item{flex:1 1 130px;max-width:180px;text-align:center;padding:.8rem .5rem;border-radius:8px;background:var(--bg-card-alt);border:1px solid var(--border);transition:border-color .3s}
.clock-item.highlight{border-color:var(--green);box-shadow:0 0 12px rgba(0,255,136,.08)}
.clock-city{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-bottom:.3rem}
.clock-tz{font-size:.6rem;color:var(--text-dim);margin-bottom:.4rem}
.clock-time{font-family:'SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:1.35rem;font-weight:700;color:var(--text);letter-spacing:.04em}
.clock-date{font-size:.6rem;color:var(--text-muted);margin-top:.25rem}
.clock-item.highlight .clock-time{color:var(--green)}

/* ---- ROLLOVER ---- */
.rollover-grid{display:flex;gap:.8rem;flex-wrap:wrap}
.rollover-card{flex:1;min-width:200px;padding:1rem;border-radius:8px;background:var(--bg-card-alt);border:1px solid var(--border)}
.rollover-symbol{font-family:monospace;font-size:1.1rem;font-weight:700;color:var(--cyan)}
.rollover-name{font-size:.7rem;color:var(--text-muted);margin-bottom:.8rem}
.rollover-row{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.78rem}
.rollover-label{color:var(--text-dim)}
.rollover-val{font-family:monospace;color:var(--text)}
.rollover-val.soon{color:var(--yellow)}
.rollover-val.imminent{color:var(--red);font-weight:700}
.days-badge{display:inline-block;padding:.15rem .55rem;border-radius:20px;font-size:.75rem;font-weight:700;font-family:monospace;margin-top:.5rem}
.days-badge.ok{background:rgba(0,255,136,.1);color:var(--green)}
.days-badge.warn{background:rgba(251,191,36,.12);color:var(--yellow)}
.days-badge.danger{background:rgba(255,51,85,.12);color:var(--red)}

/* ---- CALENDAR ---- */
.cal-controls{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem;align-items:center}
.cal-controls .spacer{flex:1}
.btn{padding:.3rem .7rem;border:1px solid var(--border-light);border-radius:6px;background:transparent;color:var(--text-dim);font-size:.72rem;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{border-color:var(--blue);color:var(--text)}
.btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-refresh{border-color:var(--green);color:var(--green)}
.btn-refresh:hover{background:rgba(0,255,136,.1)}
.impact-filters{display:flex;gap:.3rem;align-items:center}
.impact-filters span{font-size:.65rem;color:var(--text-muted);margin-right:.2rem}

.cal-meta{font-size:.65rem;color:var(--text-muted);margin-bottom:.6rem}

.cal-table{width:100%;border-collapse:collapse}
.cal-table th{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-card)}
.cal-table td{padding:.45rem .5rem;border-bottom:1px solid rgba(30,41,59,.5);font-size:.78rem;vertical-align:middle}
.cal-table tr:hover td{background:rgba(59,130,246,.04)}
.cal-table tr.high td{border-left:2px solid var(--red)}
.cal-table tr.medium td{border-left:2px solid var(--yellow)}
.cal-table tr.low td{border-left:2px solid var(--text-muted)}
.cal-date-row td{background:var(--bg-header);font-weight:600;font-size:.72rem;color:var(--blue);letter-spacing:.04em;padding:.5rem;border-left:none!important}

.pill{display:inline-block;padding:.1rem .45rem;border-radius:4px;font-size:.65rem;font-weight:600;letter-spacing:.03em}
.pill-fomc{background:rgba(255,51,85,.15);color:var(--red)}
.pill-nfp{background:rgba(251,191,36,.15);color:var(--yellow)}
.pill-cpi{background:rgba(167,139,250,.15);color:var(--purple)}
.pill-gdp{background:rgba(34,211,238,.15);color:var(--cyan)}
.pill-pmi{background:rgba(249,115,22,.15);color:var(--orange)}
.pill-rate{background:rgba(255,51,85,.15);color:var(--red)}

.currency-badge{display:inline-block;padding:.1rem .35rem;border-radius:3px;font-size:.65rem;font-weight:700;font-family:monospace;background:rgba(255,255,255,.06);color:var(--text-dim)}
.currency-badge.USD{color:var(--green);background:rgba(0,255,136,.08)}
.currency-badge.EUR{color:var(--blue);background:rgba(59,130,246,.1)}
.currency-badge.GBP{color:var(--purple);background:rgba(167,139,250,.1)}
.currency-badge.JPY{color:var(--red);background:rgba(255,51,85,.08)}
.currency-badge.CAD{color:var(--orange);background:rgba(249,115,22,.1)}
.currency-badge.AUD{color:var(--yellow);background:rgba(251,191,36,.1)}
.currency-badge.CHF{color:var(--cyan);background:rgba(34,211,238,.1)}
.currency-badge.NZD{color:#6ee7b7;background:rgba(110,231,183,.1)}
.currency-badge.CNY{color:#f87171;background:rgba(248,113,113,.08)}

.cal-scroll{max-height:520px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.cal-scroll::-webkit-scrollbar{width:5px}
.cal-scroll::-webkit-scrollbar-track{background:transparent}
.cal-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.cal-empty{text-align:center;padding:2rem;color:var(--text-muted);font-size:.85rem}
.cal-loading{text-align:center;padding:2rem;color:var(--text-dim)}
.cal-loading .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin-right:.5rem;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.footer{text-align:center;padding:1rem;font-size:.65rem;color:var(--text-muted);border-top:1px solid var(--border)}

/* Responsive */
@media(max-width:900px){
  .row-top{grid-template-columns:1fr}
}
@media(max-width:600px){
  html{font-size:13px}
  .clock-item{flex:1 1 100px;padding:.6rem .3rem}
  .clock-time{font-size:1.1rem}
  .cal-controls{gap:.3rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>Hallo Trader</h1>
  <div class="subtitle">Public View</div>
</div>

<div class="container">
  <!-- Row 1: World Clock (full width) -->
  <div class="card">
    <div class="card-head"><h2>Weltzeituhr</h2></div>
    <div class="card-body">
      <div class="clock-grid" id="clockGrid"></div>
    </div>
  </div>

  <!-- Row 2: Calendar -->
  <div class="card">
    <div class="card-head">
      <h2>Economic Calendar</h2>
      <div style="display:flex;gap:.4rem;align-items:center">
        <span class="cal-meta" id="calMeta"></span>
        <button class="btn btn-refresh" onclick="fetchCalendar()" title="Refresh">&#x21bb; Refresh</button>
      </div>
    </div>
    <div class="card-body">
      <div class="cal-controls">
        <button class="btn active" data-range="today" onclick="setRange('today',this)">Today</button>
        <button class="btn" data-range="tomorrow" onclick="setRange('tomorrow',this)">Today + Tomorrow</button>
        <button class="btn" data-range="week" onclick="setRange('week',this)">Week</button>
        <div class="spacer"></div>
        <div class="impact-filters">
          <span>Impact:</span>
          <button class="btn active" data-impact="High" onclick="toggleImpact('High',this)">High</button>
          <button class="btn active" data-impact="Medium" onclick="toggleImpact('Medium',this)">Medium</button>
          <button class="btn active" data-impact="Low" onclick="toggleImpact('Low',this)">Low</button>
        </div>
      </div>
      <div class="cal-scroll" id="calScroll">
        <div class="cal-loading"><span class="spinner"></span> Loading calendar data&hellip;</div>
      </div>
    </div>
  </div>
</div>

  <!-- Row 3: Contract Rollover -->
  <div class="card">
    <div class="card-head"><h2>Kontraktwechsel</h2></div>
    <div class="card-body">
      <div class="rollover-grid" id="rolloverGrid"></div>
    </div>
  </div>
</div>

<div class="footer">Powered by ForexFactory &middot; GitHub Pages</div>

<script>
/* ================================================================
   WORLD CLOCK
   ================================================================ */
const CLOCKS = [
  { city: 'Chicago',   tz: 'America/Chicago',    label: 'CT',  h12: true,  highlight: false },
  { city: 'New York',  tz: 'America/New_York',   label: 'ET',  h12: true,  highlight: false },
  { city: 'Frankfurt', tz: 'Europe/Berlin',       label: 'CET', h12: false, highlight: true  },
  { city: 'Dubai',     tz: 'Asia/Dubai',          label: 'GST', h12: false, highlight: false },
  { city: 'Tokyo',     tz: 'Asia/Tokyo',          label: 'JST', h12: false, highlight: false },
];

function renderClocks() {
  const grid = document.getElementById('clockGrid');
  grid.innerHTML = CLOCKS.map(c => {
    const now = new Date();
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: c.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: c.h12
    });
    const dateFmt = new Intl.DateTimeFormat('en-US', {
      timeZone: c.tz, weekday: 'short', month: 'short', day: 'numeric'
    });
    return `<div class="clock-item${c.highlight ? ' highlight' : ''}">
      <div class="clock-city">${c.city}</div>
      <div class="clock-tz">${c.label}</div>
      <div class="clock-time">${fmt.format(now)}</div>
      <div class="clock-date">${dateFmt.format(now)}</div>
    </div>`;
  }).join('');
}
renderClocks();
setInterval(renderClocks, 1000);

/* ================================================================
   CONTRACT ROLLOVER
   ================================================================ */
function getNthFriday(year, month, n) {
  let d = new Date(year, month, 1);
  let count = 0;
  while (count < n) {
    if (d.getDay() === 5) count++;
    if (count < n) d.setDate(d.getDate() + 1);
  }
  return d;
}

function getContractMonth(d) {
  const months = [2, 5, 8, 11]; // Mar Jun Sep Dec (0-indexed)
  for (const m of months) {
    const rollover = getNthFriday(d.getFullYear(), m, 2);
    if (d <= rollover) return { year: d.getFullYear(), month: m };
  }
  return { year: d.getFullYear() + 1, month: 2 };
}

function contractCode(year, month) {
  const codes = { 2: 'H', 5: 'M', 8: 'U', 11: 'Z' };
  const names = { 2: 'March', 5: 'June', 8: 'September', 11: 'December' };
  return { code: codes[month] + (year % 100), name: names[month] + ' ' + year };
}

function nextContractMonth(cm) {
  const months = [2, 5, 8, 11];
  const idx = months.indexOf(cm.month);
  if (idx < 3) return { year: cm.year, month: months[idx + 1] };
  return { year: cm.year + 1, month: 2 };
}

function renderRollover() {
  const contracts = [
    { symbol: 'MNQ', name: 'Micro E-mini Nasdaq-100' },
    { symbol: 'MES', name: 'Micro E-mini S&P 500' },
  ];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const grid = document.getElementById('rolloverGrid');
  grid.innerHTML = contracts.map(c => {
    const cm = getContractMonth(today);
    const nc = nextContractMonth(cm);
    const rollDate = getNthFriday(cm.year, cm.month, 2);
    const diff = Math.ceil((rollDate - today) / 86400000);
    const cc = contractCode(cm.year, cm.month);
    const ncc = contractCode(nc.year, nc.month);
    const badgeClass = diff <= 3 ? 'danger' : diff <= 14 ? 'warn' : 'ok';
    const rollStr = rollDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    return `<div class="rollover-card">
      <div class="rollover-symbol">${c.symbol}</div>
      <div class="rollover-name">${c.name}</div>
      <div class="rollover-row"><span class="rollover-label">Front Month</span><span class="rollover-val">${c.symbol}${cc.code} (${cc.name})</span></div>
      <div class="rollover-row"><span class="rollover-label">Next Contract</span><span class="rollover-val">${c.symbol}${ncc.code} (${ncc.name})</span></div>
      <div class="rollover-row"><span class="rollover-label">Rollover Date</span><span class="rollover-val">${rollStr}</span></div>
      <div style="text-align:center;margin-top:.3rem">
        <span class="days-badge ${badgeClass}">${diff === 0 ? 'TODAY' : diff + ' day' + (diff !== 1 ? 's' : '') + ' left'}</span>
      </div>
    </div>`;
  }).join('');
}
renderRollover();

/* ================================================================
   ECONOMIC CALENDAR
   ================================================================ */
const API_URL = 'https://nfs.faireconomy.media/ff_calendar_thisweek.json';
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
let calendarData = [];
let currentRange = 'today';
let activeImpacts = new Set(['High', 'Medium', 'Low']);

function setRange(range, btn) {
  currentRange = range;
  document.querySelectorAll('.cal-controls > .btn[data-range]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCalendar();
}

function toggleImpact(impact, btn) {
  if (activeImpacts.has(impact)) activeImpacts.delete(impact);
  else activeImpacts.add(impact);
  btn.classList.toggle('active');
  renderCalendar();
}

const KEYWORDS = [
  { re: /FOMC|Federal\s+Funds\s+Rate|Fed\s+Chair/i, cls: 'pill-fomc', label: null },
  { re: /Non.?Farm\s+Payroll|NFP|Nonfarm/i, cls: 'pill-nfp', label: null },
  { re: /\bCPI\b|Consumer\s+Price/i, cls: 'pill-cpi', label: null },
  { re: /\bGDP\b|Gross\s+Domestic/i, cls: 'pill-gdp', label: null },
  { re: /\bPMI\b|Purchasing\s+Manager/i, cls: 'pill-pmi', label: null },
  { re: /Interest\s+Rate|Rate\s+Decision|Rate\s+Statement/i, cls: 'pill-rate', label: null },
];

function tagEvent(title) {
  for (const kw of KEYWORDS) {
    const m = title.match(kw.re);
    if (m) return `<span class="pill ${kw.cls}">${m[0]}</span> `;
  }
  return '';
}

function parseCET(dateStr) {
  // dateStr comes as e.g. "2025-03-27T08:30:00-04:00" (Eastern Time from FF)
  // We parse it as-is and convert to CET for display
  return new Date(dateStr);
}

function formatTimeCET(dateStr) {
  if (!dateStr) return '&mdash;';
  const d = new Date(dateStr);
  if (isNaN(d)) return '&mdash;';
  return d.toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hour12: false });
}

function formatDateCET(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { timeZone: 'Europe/Berlin', weekday: 'long', month: 'short', day: 'numeric' });
}

function dateCETKey(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' }); // YYYY-MM-DD
}

function todayCET() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
}

function tomorrowCET() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toLocaleDateString('en-CA', { timeZone: 'Europe/Berlin' });
}

function renderCalendar() {
  const scroll = document.getElementById('calScroll');
  if (!calendarData.length) {
    scroll.innerHTML = '<div class="cal-empty">No calendar data available.</div>';
    return;
  }

  const today = todayCET();
  const tomorrow = tomorrowCET();

  let filtered = calendarData.filter(e => {
    const impact = e.impact || 'Low';
    if (!activeImpacts.has(impact)) return false;
    const dk = dateCETKey(e.date);
    if (currentRange === 'today') return dk === today;
    if (currentRange === 'tomorrow') return dk === today || dk === tomorrow;
    return true;
  });

  if (!filtered.length) {
    scroll.innerHTML = '<div class="cal-empty">No events match filters.</div>';
    return;
  }

  // Group by date
  const groups = {};
  filtered.forEach(e => {
    const dk = dateCETKey(e.date);
    if (!groups[dk]) groups[dk] = [];
    groups[dk].push(e);
  });

  let html = '<table class="cal-table"><thead><tr><th style="width:60px">Time</th><th style="width:40px">Ccy</th><th>Event</th><th style="width:70px">Forecast</th><th style="width:70px">Previous</th></tr></thead><tbody>';

  Object.keys(groups).sort().forEach(dk => {
    const events = groups[dk];
    const dateLabel = formatDateCET(events[0].date);
    const isToday = dk === today;
    html += `<tr class="cal-date-row"><td colspan="5">${dateLabel}${isToday ? ' <span style="color:var(--green);font-size:.65rem;margin-left:.4rem">TODAY</span>' : ''}</td></tr>`;

    events.forEach(e => {
      const impact = (e.impact || 'Low').toLowerCase();
      const impactClass = impact === 'high' ? 'high' : impact === 'medium' ? 'medium' : 'low';
      const ccy = e.country || '';
      const ccyClass = ['USD','EUR','GBP','JPY','CAD','AUD','CHF','NZD','CNY'].includes(ccy) ? ' ' + ccy : '';
      const tag = tagEvent(e.title || '');
      html += `<tr class="${impactClass}">
        <td style="font-family:monospace;color:var(--text-dim)">${formatTimeCET(e.date)}</td>
        <td><span class="currency-badge${ccyClass}">${ccy}</span></td>
        <td>${tag}${e.title || ''}</td>
        <td style="font-family:monospace;text-align:right">${e.forecast || '&mdash;'}</td>
        <td style="font-family:monospace;text-align:right">${e.previous || '&mdash;'}</td>
      </tr>`;
    });
  });

  html += '</tbody></table>';
  scroll.innerHTML = html;
}

async function fetchCalendar() {
  const scroll = document.getElementById('calScroll');
  const meta = document.getElementById('calMeta');
  scroll.innerHTML = '<div class="cal-loading"><span class="spinner"></span> Loading calendar data&hellip;</div>';

  let data = null;
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('Direct fetch failed');
    data = await res.json();
  } catch {
    try {
      const res = await fetch(CORS_PROXY + encodeURIComponent(API_URL));
      if (!res.ok) throw new Error('Proxy fetch failed');
      data = await res.json();
    } catch (err) {
      scroll.innerHTML = '<div class="cal-empty">Failed to load calendar data. Try refreshing.</div>';
      meta.textContent = 'Error loading data';
      return;
    }
  }

  calendarData = data;
  const now = new Date();
  meta.textContent = 'Last refresh: ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  renderCalendar();
}

fetchCalendar();
</script>
</body>
</html>
